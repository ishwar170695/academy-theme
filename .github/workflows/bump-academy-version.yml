name: Upgrade Academies

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependent-repo:
          - layer5io/layer5-academy
          - layer5io/exoscale-academy
          - layer5io/academy-build
          - layer5io/academy-example
          - meshery-extensions/meshery-academy
          - meshery-extensions/digitalocean-academy
          - meshery-extensions/tcslabs-academy
    steps:
      - name: Checkout dependent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.dependent-repo }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          ref: master

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install dependencies
        run: make setup

      - name: Update dependency in go.mod
        id: bump
        run: |
          make theme-update
          version=$(go list -m -f '{{.Version}}' github.com/layer5io/academy-theme)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          branch: update-academy-theme-${{ steps.bump.outputs.version }}
          title: "[Automated] Update academy-theme to ${{ steps.bump.outputs.version }}"
          body: |
            This PR updates the academy-theme dependency to the latest release version ${{ steps.bump.outputs.version }}.

            Changes:
            - Updated go.mod
            - Regenerated go.sum

            Auto-generated based upon release of a new version of layer5io/academy-theme.
          commit-message: Update academy-theme to ${{ steps.bump.outputs.version }}
          committer: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: true
          delete-branch: true
          labels: pr/dependencies
          assignees: l5io
          draft: false
